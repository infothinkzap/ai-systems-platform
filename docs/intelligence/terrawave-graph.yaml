  - id: opportunity:astrology_reports
    type: Opportunity
    name: Practitioner-approved astrology reports
    description: Prepare personalized astrology reports using the practitioner's own approved methods.
    problem_statement: Prepare personalized astrology reports using the practitioner's own approved methods.
    assumed_current_workflow: "Assumed, not verified: people currently prepare personalized astrology reports
      using the practitioner's own approved methods. Current order, tools and exception handling must be
      established in discovery."
    mvp_boundary: One practitioner, one input format and one report template; mandatory practitioner approval. No
      invented methodology, unagreed chart engine or automatic predictions.
    category: Professional & advisory
    match_profile:
      domain:
        - astrology
        - astrological
        - horoscope
        - birth chart
        - kundli
      task:
        - report
        - interpretation
        - write
        - make
        - generate
      artifact:
        - client
        - methods
        - practitioner
        - chart
    clarifications:
      - id: chart_data
        question: Is chart data already available, or are chart calculations required?
        options:
          - value: unknown
            label: Not sure yet
          - value: supplied
            label: Chart data is already available
          - value: calculate
            label: Chart values need to be calculated
      - id: approved_methods
        question: Are your methods and interpretations documented and approved?
        options:
          - value: unknown
            label: Not sure yet
          - value: documented
            label: Methods are documented and approved
          - value: undocumented
            label: Methods still need to be documented
      - id: astrology_reports_3
        question: What consent, report sections and review criteria are required?
        options: []
    maturity_status: concept
    epistemic_status: hypothesis
    evidence:
      - internal_reasoning
    validation_status: needs_validation
    knowledge_layer: possibility
